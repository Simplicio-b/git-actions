name: Dev Release & Auto-Tag

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
 
  create-dev-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      new_tag: ${{ steps.versioning.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      # --- RUN TESTS
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node_modules_cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
           ${{ runner.os }}-node_modules-
      
      - name: Install dependencies
        if: steps.node_modules_cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run test
        run: npm run test:cov     

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
      
      # --- NOVO STEP: PRINT DA ÚLTIMA TAG ---
      - name: Show Previous Tag
        # Tenta pegar a última tag (suprimindo erros caso não exista nenhuma)
        # '2>/dev/null' esconde mensagens de erro do git se for um repo novo
        # '||' define um valor padrão caso falhe
        run: |
          echo "Buscando última tag existente no repositório..."

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "Nenhuma tag encontrada (Primeira execução?)")
          
          echo "=============================================="
          echo "  ÚLTIMA TAG ENCONTRADA: $LAST_TAG"
          echo "=============================================="

      - name: Generate Dev version & tag
        id: versioning

        # Gera uma versão prerelease (ex: 1.2.3-DEV.0)
        # O --no-git-tag-version evita que o npm crie a tag git automaticamente, queremos controlar isso
        # Pega a versão atualizada do package.json
        # Cria a tag no Git e sobe
        # Exporta para os próximos jobs

        # ======================================
        # VERSSAO ANTERIOR
        # AJUSTAR A TAG PARA SER COMPATIVEL COM A VERSÃO DO PACKAGE.JSON
        run: |
          npm version prerelease --preid=DEV --no-git-tag-version         
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
           
          echo "Nova versão gerada: $TAG"
           
          git tag $TAG
          git push origin $TAG
          
          echo "version=$TAG" >> $GITHUB_OUTPUT

